<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>VoteWise AI - Election Process Education</title>
    <meta name="title" content="VoteWise AI - Election Process Education" />
    <meta name="description" content="Master the democratic process with VoteWise AI. Interactive timelines, quizzes, and an AI assistant to guide you through every step of voting." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Google Identity Services (Sign in with Google) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Google Translate Script -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'en', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <style>
      /* Hide the Google Translate toolbar */
      .goog-te-banner-frame.skiptranslate { display: none !important; }
      body { top: 0 !important; }
      #google_translate_element { margin: 10px; }
      .goog-te-gadget-simple {
        background-color: rgba(30, 41, 59, 0.4) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        padding: 6px 12px !important;
        border-radius: 8px !important;
        font-family: 'Inter', sans-serif !important;
      }
      .goog-te-gadget-simple img { display: none !important; }
      .goog-te-gadget-simple span { color: #f8fafc !important; font-size: 14px !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Google One Tap / Sign In Container -->
    <div id="g_id_onload"
         data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
